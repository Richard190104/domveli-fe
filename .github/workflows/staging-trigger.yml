name: Staging trigger

# Push do vetvy staging -> spusti Deploy na main (ten zbuilduje main aj staging).
on:
  push:
    branches: [staging]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Spusti Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
